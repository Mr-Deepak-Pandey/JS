<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | apna Chai aur Code</title>
</head>
<body style="background-color: black; color: antiquewhite;">
<div class="parent">
    <!-- //this is a comment -->
    <div class="day">Monday</div>
    <div class="day">Tuesday</div>
    <div class="day">Wednesday</div>
    <div class="day">Thursday</div>
</div>
    
</body>
<script>

    document.querySelector(".parent");
    const parent=document.querySelector('.parent');
    console.log(parent);
    // html collection deta hai children nodes ka
    console.log(parent.children);
    console.log(parent.children[1].innerHTML);//to access an element of HTML Collection

    for (let i = 0; i < parent.children.length; i++) {
      console.log(parent.children[i].innerHTML);
        
    }

    parent.children[1].style.color="orange";
    console.log(parent.firstElementChild)//first Child
    console.log(parent.lastElementChild)//last child

    const dayOne=document.querySelector(".day");//first children select kiya
    console.log(dayOne)

    console.log(dayOne.parentElement)//finding parent element if you have child 
    console.log(dayOne.nextElementSibling);//next sibling of child


    //gives NodeList containing number of nodes of parent class
    console.log("Number of Nodes:",parent.childNodes);
    // A nodelist is a collection of document nodes which includes text nodes , attribute nodes and element nodes. A line break is also counted in nodelist but only first one. All subsequent line breaks are ignored by browser


</script>

</html>
